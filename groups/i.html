<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="container">
      <a href="../index.html" class="site-nav__brand">第一版機台的原型紀錄</a>
      <ul class="site-nav__links">
        <li><a href="../index.html#groups">← 回團體作品區</a></li>
      </ul>
    </div>
  </nav>

  <header class="student-hero">
    <div class="student-hero__photo student-hero__photo--video">
      <video src="../assets/機台影片/I.mov" controls preload="metadata"></video>
    </div>
    <h1 class="group-hero__title">「我的攤位」</h1>
    <p class="group-hero__groupname">I組</p>
    <p class="student-hero__group">組員：<a href="../students/i-1.html">張諄楷</a>、<a href="../students/i-2.html">陳定鴻</a>、<a href="../students/i-3.html">劉億承</a>、<a href="../students/i-4.html">李侑磬</a>｜組長：<a href="../students/i-2.html">陳定鴻</a></p>
  </header>

  <main class="section">
    <div class="container student-content">
    
    <section class="exhibit-block"><span class="exhibit-block__label">招牌設計</span><div class="sign-showcase"><img src="../assets/media/groups/i/sign.png" alt="I組招牌" loading="lazy" /></div></section>
    <section class="exhibit-block"><span class="exhibit-block__label">機台的簡介</span><div class="slide-text"><p>一個撈魚遊戲</p></div></section>
    <section class="exhibit-block"><span class="exhibit-block__label">機台的遊玩方式</span><div class="slide-text"><p>揮動魚網捕捉魚</p></div></section>
    <section class="exhibit-block"><span class="exhibit-block__label">機台的運作原理</span><div class="slide-text"><p>觸發微動開關傳送訊號再轉為空白鍵觸發魚網</p></div></section>
    <section class="exhibit-block"><span class="exhibit-block__label">未來展望</span><div class="slide-text"><p>優化譜面</p><p>製作兩種魚，需要用兩種按鍵抓取</p><p>優化線路</p><p>優化漁網外觀</p></div></section>
    <section class="exhibit-block"><span class="exhibit-block__label">製作紀錄</span><div class="slide-images slide-images--gallery"><img src="../assets/media/groups/i/gallery-4-1.png" alt="製作紀錄" loading="lazy" /></div></section>
    <h2 class="content-heading">小組分工</h2>
    <div class="assignment-list"><div class="assignment-block"><h3 class="assignment-block__name"><a href="../students/i-2.html">陳定鴻</a></h3><div class="slide-text"><p>遊戲程式、arduino的程式、接線輔助</p></div><div class="slide-images"><img src="../assets/media/groups/i/assign-2-1.png" alt="陳定鴻" loading="lazy" /></div></div><div class="assignment-block"><h3 class="assignment-block__name"><a href="../students/i-1.html">張諄楷</a></h3><div class="slide-text"><p>接線、建模、木工</p></div></div><div class="assignment-block"><h3 class="assignment-block__name"><a href="../students/i-3.html">劉億承</a></h3><div class="slide-text"><p>畫動畫、素材、編譜、招牌</p></div><div class="slide-images"><img src="../assets/media/groups/i/assign-3-1.png" alt="劉億承" loading="lazy" /><img src="../assets/media/groups/i/assign-3-2.png" alt="劉億承" loading="lazy" /><img src="../assets/media/groups/i/assign-3-3.png" alt="劉億承" loading="lazy" /></div></div><div class="assignment-block"><h3 class="assignment-block__name"><a href="../students/i-4.html">李侑磬</a></h3><div class="slide-text"><p>招牌</p></div><div class="slide-images"><img src="../assets/media/groups/i/assign-4-1.png" alt="李侑磬" loading="lazy" /></div></div></div>

  <footer class="site-footer">
